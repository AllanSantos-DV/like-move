name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Mesmos testes do workflow Tests (Python 3.9 e 3.12, Pester): a release só é construída se passarem.
  tests:
    uses: ./.github/workflows/tests.yml

  build-release:
    needs: tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release só sai de um commit que já está na master.
      - name: Tag commit is on master
        shell: pwsh
        run: |
          git fetch origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "O commit da tag $env:GITHUB_REF_NAME não está na master." }

      # O app compara a tag da release com o VERSION embutido no exe: tag diferente de VERSION
      # entregaria um exe que se oferece para atualizar para si mesmo.
      - name: Tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content like-move/VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "A tag $env:GITHUB_REF_NAME não bate com like-move/VERSION (v$version)."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: like-move/requirements.txt

      # Bootloader compilado no runner (MSVC): o pré-compilado é o mesmo para todo usuário
      # de PyInstaller e aparece em listas de antivírus.
      - name: Install dependencies (PyInstaller with locally compiled bootloader)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install -r like-move/requirements.txt
          pip install --no-binary pyinstaller pyinstaller

      - name: Build (onedir, no UPX)
        working-directory: like-move
        run: python -m PyInstaller like-move.spec --noconfirm

      - name: Package
        working-directory: like-move
        shell: pwsh
        run: |
          if (-not (Test-Path dist/like-move/like-move.exe)) { throw 'dist/like-move/like-move.exe não foi gerado' }
          Compress-Archive -Path dist/like-move -DestinationPath dist/like-move-win64.zip
          # Mesmo script do build.ps1: só os scripts e o LEIA-ME entram no zip.
          .\package-home-awake.ps1

      # Sai como rascunho: só é publicada depois de baixada e verificada pelo antivírus.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "like-move ${{ github.ref_name }}"
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            like-move/dist/like-move-win64.zip
            like-move/dist/home-awake.zip
