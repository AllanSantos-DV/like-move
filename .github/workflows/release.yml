name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: like-move/requirements.txt

      # Bootloader compilado no runner (MSVC): o pré-compilado é o mesmo para todo usuário
      # de PyInstaller e aparece em listas de antivírus.
      - name: Install dependencies (PyInstaller with locally compiled bootloader)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install -r like-move/requirements.txt
          pip install --no-binary pyinstaller pyinstaller

      - name: Unit tests
        working-directory: like-move
        run: python -m unittest discover -s tests -v

      # Pester 3.4 é o que vem com o Windows PowerShell 5.1; o runner traz um Pester mais novo ao lado,
      # com sintaxe incompatível com estes testes.
      - name: Home Awake tests (Pester 3.4)
        working-directory: like-move/home-awake
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $r = Invoke-Pester -Path .\tests\HomeAwake.Tests.ps1 -PassThru
          Write-Host "Pester: passed=$($r.PassedCount) failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { exit 1 }

      - name: Build (onedir, no UPX)
        working-directory: like-move
        run: python -m PyInstaller like-move.spec --noconfirm

      - name: Package
        working-directory: like-move
        shell: pwsh
        run: |
          Compress-Archive -Path dist/like-move -DestinationPath dist/like-move-win64.zip
          # Mesmo script do build.ps1: só os scripts e o LEIA-ME entram no zip.
          .\package-home-awake.ps1

      # Sai como rascunho: só é publicada depois de baixada e verificada pelo antivírus.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "like-move ${{ github.ref_name }}"
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            like-move/dist/like-move-win64.zip
            like-move/dist/home-awake.zip
