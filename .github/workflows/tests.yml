name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 é o mínimo declarado no README; 3.12 é a versão do build da release.
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: like-move/requirements.txt

      - name: Install dependencies
        run: pip install -r like-move/requirements.txt

      - name: Unit tests
        working-directory: like-move
        run: python -m unittest discover -s tests -v

      # Pester 3.4 é o que vem com o Windows PowerShell 5.1; o runner traz um Pester mais novo ao lado,
      # com sintaxe incompatível com estes testes. Não depende do Python: roda uma vez.
      - name: Home Awake tests (Pester 3.4)
        if: matrix.python-version == '3.12'
        working-directory: like-move/home-awake
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $r = Invoke-Pester -Path .\tests\HomeAwake.Tests.ps1 -PassThru
          Write-Host "Pester: passed=$($r.PassedCount) failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { exit 1 }

  # Pacote npm (npx like-move): node 20 é o mínimo declarado em engines.
  npm-package:
    name: tests (pacote npm, Node 20)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        working-directory: like-move/npm
        run: npm test

  # requirements.txt declara Pillow>=9.1.0: as outras vagas instalam a última versão e nunca testam o piso.
  pillow-floor:
    name: tests (Python 3.9, Pillow 9.1.0)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install the declared floor
        run: |
          pip install -r like-move/requirements.txt
          pip install "Pillow==9.1.0"

      - name: Unit tests
        working-directory: like-move
        run: python -m unittest discover -s tests -v
